<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d2b16">
  <title>Free Kick Legends</title>
  <link rel="stylesheet" href="style.css?v=5">
  <!-- Three.js (biblioteca de 3D) em versão fixa, carregada de um CDN -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="jogo"></div>

  <div id="hud">
    <div id="topo">
      <div id="titulo">FREE KICK <span>LEGENDS</span></div>
      <div id="topo-direita">
        <span id="versao"></span>
        <button id="botao-mudo" class="botao-redondo" type="button" aria-label="Desligar som" hidden>🔊</button>
        <button id="botao-ajustes" class="botao-redondo" type="button" aria-label="Painel de ajuste">⚙</button>
      </div>
    </div>

    <div id="linha-info">
      <button id="cartao-cobrador" type="button" aria-label="Trocar cobrador"></button>
      <div id="info-direita">
        <div id="info"></div>
        <div id="placar"></div>
        <button id="botao-fixar" type="button" hidden>🎲 Falta sorteada</button>
      </div>
    </div>
    <div id="mensagem"></div>

    <div id="resultado">
      <div id="resultado-titulo"></div>
      <div id="resultado-sub"></div>
    </div>
    <button id="botao-video" type="button" hidden>📥 Baixar o vídeo do gol</button>

    <div id="controles">
      <div id="barra"><div id="barra-preenchida"></div><div id="barra-ideal"></div></div>
      <div id="linha-chute">
        <div id="contato">
          <div id="contato-bola"><div id="contato-ponto"></div></div>
          <div id="contato-rotulo"></div>
        </div>
        <button id="botao-chute" type="button">CHUTAR</button>
      </div>
      <div id="dica">Toque na bola para escolher onde o pé pega. Segure CHUTAR e solte.</div>
    </div>

    <div id="lista-cobradores" hidden>
      <div class="folha">
        <div class="folha-cabecalho">
          <b>Quem bate?</b>
          <button id="lista-fechar" type="button">Fechar</button>
        </div>
        <p class="folha-explica">Ordenados pela nota para ESTA falta: distância, lado do campo, pé bom e estilo de cada um. O overall é só referência.</p>
        <div id="lista-itens"></div>
      </div>
    </div>

    <div id="painel" hidden>
      <div id="painel-cabecalho">
        <b>Painel de ajuste</b>
        <button id="painel-fechar" type="button">Fechar</button>
      </div>
      <div id="painel-campos"></div>
      <div id="painel-acoes">
        <button id="painel-copiar" type="button">Copiar valores</button>
        <button id="painel-restaurar" type="button">Restaurar padrão</button>
      </div>
      <div id="painel-aviso"></div>
    </div>
  </div>

  <noscript>Este jogo precisa de JavaScript ligado.</noscript>
  <script type="module" src="js/main.js?v=5"></script>
</body>
</html>
